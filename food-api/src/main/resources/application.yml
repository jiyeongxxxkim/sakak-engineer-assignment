spring:
  application:
    name: food-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/food?rewriteBatchedStatements=true}
    username: ${DB_USERNAME:food}
    password: ${DB_PASSWORD:food}
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  seed:
    enabled: ${SEED_ENABLED:false}
    file: ${SEED_FILE:data/food_nutrition.xlsx}
